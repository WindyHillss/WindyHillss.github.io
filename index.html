  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: "Geist", sans-serif;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #03142c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen img {
      width: 64px;
      height: 64px;
    }

    .loading-text {
      margin-top: 14px;
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .loading-bar-track {
      margin-top: 12px;
      width: 120px;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #caeffc;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    canvas {
      display: block;
    }

    .profile-wrapper {
      position: absolute;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      padding: 14px;
      background: rgba(20, 25, 40, .67);
      backdrop-filter: blur(14px);
      max-height: 90px;
      transition: .35s;
    }

    .profile-card:hover {
      max-height: 220px;
      transform: translateY(-4px);
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* avatar container adjusted to match decoration sizes */
    .avatar-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      flex-shrink: 0;
    }

    .profile-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100px;
      height: 100px;
      border-radius: 100%;
      object-fit: cover;
      z-index: 2;
      display: block;
    }

    .profile-decoration-img {
      position: absolute;
      top: -9px;
      left: -9px;
      width: 118px;
      height: 118px;
      object-fit: cover;
      z-index: 3;
      pointer-events: none;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .name {
      position: relative;
      display: inline-block;

      color: transparent;

      background: linear-gradient(
          120deg,
          #ffffff 0%,
          #ffffff 40%,
          #caeffc 50%,
          #ffffff 60%,
          #ffffff 100%
      );

      background-size: 200% 100%;
      background-position: 200% center;

      -webkit-background-clip: text;
      background-clip: text;
    }

    .profile-card:hover .name.active {
      animation: textShine 3s ease-in-out;
    }

    @keyframes textShine {
      0% { background-position: 200% center; }
      45% { background-position: -70% center; }
      100% { background-position: -70% center; }
    }

    /* star move */
    .name::after {
      content: "✦";
      position: absolute;
      top: 50%;
      left: 0;
      font-size: 11px;
      color: white;
      text-shadow:
        0 0 6px rgba(255,255,255,.9),
        0 0 12px rgba(255,255,255,.7),
        0 0 20px rgba(255,255,255,.5);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.2) rotate(0deg);
    }

    .profile-card:hover .name.active::after {
      animation: sparkle 3s ease-in-out;
    }

    /* Star move */
    @keyframes sparkle {
      0%, 30% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2) rotate(0deg);
      }
      34% {
        left: 102%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(20deg);
      }
      40% {
        opacity: .9;
        transform: translate(-50%, -50%) scale(.9) rotate(60deg);
      }
      48% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.8) rotate(120deg);
      }
      100% {
        left: 102%;
        opacity: 0;
      }
    }

    .role {
      color: rgba(255, 255, 255, .55);
      font-size: 12px;
    }

    .about {
      margin-top: 0px;
      padding-top: 0px;
	  margin-left: 4px;
      border-top: none;
      color: rgba(255, 255, 255, .75);
      font-size: 11px;
      opacity: 0;
      transform: translateY(10px);
      transition: .25s;
    }

    .profile-card:hover .about {
      opacity: 1;
      transform: none;
    }

    .music-bar {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .music-bar-fill {
      height: 100%;
      width: 0%;
      background: #caeffc;
      border-radius: 2px;
      transition: width 0.2s linear;
    }

    .music-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .music-row .music-bar {
      flex: 1;
      margin-bottom: 0;
    }

    .mute-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .mute-btn:hover {
      color: rgba(255,255,255,0.7);
    }
	
    .actions {
      margin-top: 10px;
      display: flex;
      flex-direction: row;
      gap: 8px;
      opacity: 0;
      transform: translateY(8px);
      transition: .25s;
      justify-content: space-between;
    }

    .profile-card:hover .actions {
      opacity: 1;
      transform: none;
    }
	
	/* buttons */
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      flex: 1 1 auto;
      max-width: 80px;
      min-width: 32px;
      height: 28px;
      padding: 6px 8px;
      background: rgba(255,255,255,0.03);
      color: #e6f7ff;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .12s, background .12s, box-shadow .12s;
	  box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: block;
      color: currentColor;
    }

    .action-btn span {
      display: inline-block;
      line-height: 1;
      font-size: 13px;
    }
	
  /* wp by */
  .site-wp-by {
    position: fixed;
    bottom: 10px;
    right: 15px;
    font-size: 10px;
    color: #888;
    font-family: 'Poppins', sans-serif;
    opacity: 0.6;
    z-index: 1;
    user-select: none;
  }
  
  .site-wp-by a {
    color: #888;
    text-decoration: none;
    transition: 0.2s;
  }

  .site-wp-by a:hover {
    color: #fff;
  }

    /* to prevent buttons from overflowing on small screens */
    @media (max-width: 360px) {
      .profile-wrapper { left: 16px; width: calc(100% - 32px); }
      .action-btn { max-width: 30%; }
    }
  </style>
